name: Publish Open Research Protocol to npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact tagged package version at main HEAD
        required: true
        type: string
concurrency:
  group: orp-npm-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orp-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/orp-candidate
      - name: Validate main lineage, tag, lockfile and requested version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          node scripts/npm-prepublish-guard.js
          node -e '
            const version = require("./package.json").version;
            const requested = process.env.GITHUB_EVENT_NAME === "push" ? process.env.GITHUB_REF_NAME.slice(1) : process.env.REQUESTED_VERSION;
            if (version !== requested) throw Error("Requested version differs from package");
            if (process.env.GITHUB_EVENT_NAME !== "push" && process.env.GITHUB_REF !== "refs/heads/main") throw Error("Manual publication requires main");
          '
      - name: Publish and verify the tested tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-candidate.js "$RUNNER_TEMP/orp-candidate"
